# Tests on every push/PR (including real key events under Xvfb).
# On a v* tag: builds the standalone binary on Debian 12, the .deb and the USB bundle,
# and attaches them to the GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk xvfb xdotool
      - run: SMARTNAV_X_TEST=1 xvfb-run -a python3 -m unittest -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/release.sh
      - run: gh release create "$GITHUB_REF_NAME" --title "SmartNav $GITHUB_REF_NAME" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}
